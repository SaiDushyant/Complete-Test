[pytest]
# Directory paths to search for tests
testpaths = 
    ui_regression/tests
    workflows

# File and function naming conventions
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test execution options: verbose output and strict marker registration
addopts = -v --strict-markers

# Registered markers for segregating test execution
markers =
    trade: Behavioral workflow tests for Trade Terminal portal (Developer 1)
    admin: Behavioral workflow tests for Admin Management Portal (Developer 2)
    client: Behavioral workflow tests for Client Portal (Developer 3)
    orders: Orders management and verification tests for Admin Portal
    shared: Shared infrastructure tests and cross-portal validations
    e2e: End-to-end multi-account and cross-portal workflow tests
    smoke: Fast smoke tests validating critical user paths
    regression: Full behavioral and functional regression tests
    critical: High-severity blocker workflows requiring immediate alerts
    ui: DOM structural regression and drift detection tests
    mam: Multi-Account Manager (MAM) follower and manager workflow tests
    pamm: Percentage Allocation Management Module (PAMM) workflow tests
    integration: Cross-portal and multi-system integration tests
    negative: Negative test scenarios, boundary validations, and security edge cases
    category_a: Real-Time Order Execution & State Lifecycle tests
    category_b: Admin Direct B-Book Order Placement & Forced Liquidation tests
    category_c: Advanced Multi-Field Edit, Boundary Validations & Audit Log Sync tests
    validation: Element-level validation testing, boundary conditions, financial math, and input sanitization
    mock: Mock server, API response, and network interception tests

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
