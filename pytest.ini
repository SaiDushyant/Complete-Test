[pytest]
# Directory paths to search for tests
testpaths = 
    ui_regression/tests
    workflows

# File and function naming conventions
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test execution options: verbose output and strict marker registration
addopts = -v --strict-markers

# Registered markers for segregating test execution
markers =
    trade: Behavioral workflow tests for Trade Terminal portal (Developer 1)
    admin: Behavioral workflow tests for Admin Management Portal (Developer 2)
    client: Behavioral workflow tests for Client Portal (Developer 3)
    shared: Shared infrastructure tests and cross-portal validations
    smoke: Fast smoke tests validating critical user paths
    regression: Full behavioral and functional regression tests
    critical: High-severity blocker workflows requiring immediate alerts
    ui: DOM structural regression and drift detection tests

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
